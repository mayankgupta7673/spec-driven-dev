# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core app to Azure Function App - sdd-demo

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'src/SddDemo.Functions' # the actual Functions project — not the repo root (which also contains the test project)
  DOTNET_VERSION: '10.0.x' # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: windows-latest
    
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Run offline tests'
        shell: pwsh
        run: dotnet test SddDemo.slnx --configuration Release

      - name: 'Publish Function App'
        shell: pwsh
        run: dotnet publish '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/SddDemo.Functions.csproj' --configuration Release --output './output'

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'sdd-demo'
          slot-name: 'Production'
          package: './output'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3111CDB091614A03A0CA50E072837443 }}
